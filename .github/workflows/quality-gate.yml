name: Performance and Security Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: PERFORMANCE TESTING
  performance:
    name: Performance Testing

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare reports folder
        run: |
          mkdir -p reports
          chmod 777 reports

      - name: Run k6 performance tests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            grafana/k6:latest \
            run \
            --summary-export=reports/k6-summary.json \
            performance/load-test.js

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: reports/k6-summary.json
          if-no-files-found: ignore


  # JOB 2: SECURITY TESTING
  security:
    name: Security Testing

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: |
          npx vitest run \
            tests/api-client.test.ts \
            tests/zap-report-parser.test.ts

      - name: Check TypeScript
        run: npm run typecheck

      - name: Prepare reports folder
        run: |
          mkdir -p reports
          chmod 777 reports

      - name: Create Docker network
        run: docker network create qa-network

      - name: Start Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            --network qa-network \
            --network-alias juice-shop \
            bkimminich/juice-shop

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do

            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Juice Shop is ready!"
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 2

          done

          echo "Juice Shop failed to start."
          docker logs juice-shop
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          set +e

          docker run --rm \
            --network qa-network \
            -v "$PWD/reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://juice-shop:3000 \
            -J zap-report.json \
            -r zap-report.html \
            -I

          zap_status=$?

          set -e

          echo "ZAP exit code: $zap_status"

          if [ "$zap_status" -eq 3 ]; then
            echo "ZAP scanner encountered an error."
            exit 1
          fi

          if [ ! -s reports/zap-report.json ]; then
            echo "ZAP JSON report was not generated."
            exit 1
          fi

          if [ ! -s reports/zap-report.html ]; then
            echo "ZAP HTML report was not generated."
            exit 1
          fi

          echo "ZAP reports generated successfully."

      - name: Check High-risk findings
        run: npm run security:check

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/zap-report.json
            reports/zap-report.html
          if-no-files-found: ignore